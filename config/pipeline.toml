# Pipeline parameters: WHAT the pipeline does. Versioned with the code and baked into the image.
# Infra settings (WHERE it runs) come from environment variables; see config/*.env.
# Every section is part of its stage's fingerprint, so editing a value invalidates cached outputs.

[pipeline]
# Bump when stage logic changes meaning without a parameter change. This invalidates success markers.
version = "2"

[prepare]
max_unknown_material_frac = 0.05
max_dropped_frac = 0.20
neighbour_radius_m = 500

[train]
numeric_features = ["age_years", "diameter_mm", "log_length", "num_breaks_5yr", "dist_to_center_m", "neighbours_500m"]
categorical_features = ["material", "soil_type", "pressure_zone"]
n_estimators = 200
max_depth = 3
learning_rate = 0.1
random_state = 7
# Spatial holdout. 1 km blocks are twice the 500 m density radius, which limits neighbourhood
# overlap between training and holdout pipes. 20% of blocks leaves about 100 leaking pipes to evaluate on.
block_size_m = 1000
holdout_pct = 20
cv_folds = 5
top_k_frac = 0.10
# Drift reference saved with the model: decile bins per numeric feature (see src/pipesense/drift.py).
drift_bins = 10

[predict]
# Warn when a feature's PSI against the model's training data exceeds this (0.2 is the usual "significant shift").
psi_warn_threshold = 0.2

[gate]
# What winning means; the rules are documented in src/pipesense/gate.py and DECISIONS.md.
top_k_frac = 0.10                     # inspection budget: the riskiest 10% of pipes
min_lift_over_baseline = 0.0          # holdout AP must at least match "oldest pipes first"
min_improvement_over_champion = 0.005 # a tie does not replace the champion (no churn)
max_precision_at_k_drop = 0.02
max_brier_increase = 0.01
bootstrap_samples = 1000              # reported in the audit, not gated on (see DECISIONS.md)
