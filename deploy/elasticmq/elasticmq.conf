# Local SQS-compatible broker. Same API, same boto3 code, same redrive semantics as Amazon SQS.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq        # queue URLs must resolve inside the compose network
  port = 9324
  context-path = ""
}
generate-node-address = false

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {              # queue statistics: http://localhost:9325/statistics/queues
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  pipesense-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    # Backstop only: the worker dead-letters after PIPESENSE_MAX_ATTEMPTS (3) itself. This catches
    # messages whose worker crashed before it could decide (a crash loop, OOM kills).
    deadLettersQueue {
      name = "pipesense-jobs-dlq"
      maxReceiveCount = 5
    }
  }
  pipesense-jobs-dlq { }
}

aws {
  region = us-east-1
  accountId = 000000000000
}
